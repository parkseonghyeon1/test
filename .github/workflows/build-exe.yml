name: Build Windows exe

on:
  push:
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Detector test (window size / aspect ratio changes)
        run: python tests/test_detector_resize.py

      - name: Windows self-test (capture / input / detector)
        run: python tests/win_selftest.py

      - name: Build exe
        run: |
          "VERSION = 'v1.1.${{ github.run_number }}'" | Out-File -Encoding utf8 version.py
          pyinstaller --onefile --windowed --uac-admin --name EclipseSkip --add-data "templates;templates" app.py

      - name: Smoke test (GUI exe launches, engine runs, exits cleanly)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath .\dist\EclipseSkip.exe -ArgumentList "--selftest", $out -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "GUI did not exit" }
          $r = Get-Content $out -ErrorAction Stop
          Write-Host "selftest: $r"
          if ($r -ne "ok") { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: EclipseSkip
          path: dist/EclipseSkip.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: EclipseSkip v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/EclipseSkip.exe
          body: |
            `EclipseSkip.exe` 를 다운로드해서 더블클릭하면 바로 실행됩니다. (Python 설치 불필요)
            - 실행하면 관리자 권한 확인 창(UAC)이 뜹니다 → '예'
            - Ctrl+F10: 일시정지/재개
